*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Tahoma,Arial,sans-serif;
    background:#07090f;
    color:#fff;
    min-height:100vh;
}

.header{
    background:#11151d;
    border-bottom:1px solid #252b36;
    padding:18px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:24px;
    font-weight:bold;
}

.logo span{
    color:#ff2633;
}

.admin{
    color:#aaa;
    font-size:13px;
}

.container{
    max-width:1100px;
    margin:auto;
    padding:20px;
}

.title{
    margin-bottom:20px;
}

.title h1{
    font-size:25px;
    margin-bottom:7px;
}

.title p{
    color:#888;
}

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
    margin-bottom:25px;
}

.stat{
    background:#11151d;
    border:1px solid #252b36;
    border-radius:15px;
    padding:20px;
}

.stat h3{
    color:#999;
    font-size:14px;
    margin-bottom:10px;
}

.stat strong{
    font-size:25px;
}

.card{
    background:#11151d;
    border:1px solid #252b36;
    border-radius:18px;
    padding:20px;
    margin-bottom:20px;
}

.card h2{
    font-size:19px;
    margin-bottom:18px;
}

.form{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

label{
    display:block;
    color:#aaa;
    margin-bottom:7px;
    font-size:13px;
}

input,select,textarea{
    width:100%;
    background:#080b11;
    color:#fff;
    border:1px solid #303744;
    border-radius:10px;
    padding:13px;
    outline:none;
    font-family:inherit;
}

input:focus,select:focus,textarea:focus{
    border-color:#ff2633;
}

textarea{
    min-height:90px;
    resize:vertical;
}

.full{
    grid-column:1/-1;
}

button{
    border:0;
    border-radius:10px;
    padding:13px 20px;
    font-family:inherit;
    font-weight:bold;
    cursor:pointer;
}

.btn{
    background:#ff2633;
    color:#fff;
}

.btn:hover{
    background:#d91d29;
}

.btn-dark{
    background:#242a34;
    color:#fff;
}

.custom-list{
    display:grid;
    gap:12px;
}

.custom{
    background:#0b0e14;
    border:1px solid #292f3a;
    border-radius:13px;
    padding:16px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
}

.custom-info h3{
    margin-bottom:7px;
}

.custom-info p{
    color:#999;
    font-size:13px;
}

.badge{
    display:inline-block;
    background:#211316;
    color:#ff4a54;
    padding:5px 9px;
    border-radius:7px;
    font-size:11px;
    margin-top:7px;
}

.actions{
    display:flex;
    gap:7px;
}

.wallet{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:#0b0e14;
    border:1px solid #292f3a;
    border-radius:13px;
    padding:18px;
}
